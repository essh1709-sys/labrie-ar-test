}
function draw(t){
 t=clamp(t,0,STORY);
 ctx.clearRect(0,0,W,H);
 const phase=t<SCENE?0:t<SCENE*2?1:2;
 const local=t-phase*SCENE;
 ctx.save();
 // Different, clearly separated scenes; no long alpha crossfade or ghosting.
 if(phase===0)sceneOne(ctx,t);
 else if(phase===1)sceneTwo(ctx,t);
 else sceneThree(ctx,t);
 ctx.restore();
 garland(ctx,t);snow(ctx,t);
 // Brief golden curtain rather than blending two frames.
 const gate=Math.max(0,1-Math.abs(t-SCENE)/.35,1-Math.abs(t-2*SCENE)/.35);
 if(gate>0){ctx.save();ctx.globalAlpha=gate*.8;ctx.fillStyle='#2e1320';ctx.fillRect(0,0,W,H);for(let i=0;i<40;i++)star(ctx,(i*71)%W,80+(i*97)%700,2,.65);ctx.restore()}
 // Slow 1.6 s reveal at beginning; last frame remains.
 const alpha=smooth(0,1.6,t);if(alpha<1){ctx.fillStyle='rgba(16,12,25,'+(1-alpha)+')';ctx.fillRect(0,0,W,H)}
}
function label(t){return t<SCENE?'Глава 1 · Молоко с зимней фермы':t<SCENE*2?'Глава 2 · В медном чане':'Глава 3 · Рождается сыр'}
function paint(t){draw(t);if(texture)texture.needsUpdate=true}
function hint(visible){$('scanHint').classList.toggle('hide',!visible)}
function hideOnTrack(){hint(false)}
function replay(){storyStart=performance.now();pausedAt=0;$('actions').classList.remove('show');$('sceneLabel').classList.remove('show');lastPaint=-1}
$('gift').onclick=()=>{window.location.assign('https://labrie.ru/club')};
$('about').onclick=()=>{window.location.assign('https://labrie.ru/resources')};
$('replay').onclick=()=>{if(!tracked){hint(true);return}replay()};
async function startAR(){
 $('start').disabled=true;$('error').textContent='';
 try{
   if(!navigator.mediaDevices?.getUserMedia)throw Error('Камера недоступна: откройте ссылку в Safari или Chrome.');
   // Request the camera directly from the user gesture, as on approved cheese AR.
   previewStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
   $('intro').classList.add('hide');$('ui').style.display='block';
   const target=await fetch('./targets.mind');
   if(!target.ok)throw Error('Не найден файл targets.mind');
   const targetUrl=URL.createObjectURL(await target.blob());
   const [THREE,{MindARThree}]=await Promise.all([import('three'),import('mindar-image-three')]);
   mindar=new MindARThree({container:$('ar'),imageTargetSrc:targetUrl,maxTrack:1,
     filterMinCF:.001,filterBeta:.05,warmupTolerance:5,missTolerance:12,uiLoading:'yes',uiScanning:'no'});
   anchor=mindar.addAnchor(0);
   paint(0);texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;
   texture.minFilter=THREE.LinearFilter;texture.magFilter=THREE.LinearFilter;
   const mat=new THREE.MeshBasicMaterial({map:texture,side:THREE.DoubleSide,transparent:true,depthWrite:false,toneMapped:false});
   plane=new THREE.Mesh(new THREE.PlaneGeometry(1.46,1.46*H/W),mat);plane.position.set(0,0,.12);anchor.group.add(plane);
   plane.visible=false;
   anchor.onTargetFound=()=>{
     const now=performance.now();if(!storyStart)storyStart=now;else if(pausedAt)storyStart+=now-pausedAt;
     pausedAt=0;tracked=true;plane.visible=true;hideOnTrack()
   };
   anchor.onTargetLost=()=>{if(tracked)pausedAt=performance.now();tracked=false;plane.visible=false;hint(true)};
   previewStream.getTracks().forEach(x=>x.stop());previewStream=null;
   await mindar.start();
   mindar.renderer.setAnimationLoop(()=>{
     if(tracked){
       const sec=Math.min(STORY,(performance.now()-storyStart)/1000);
       if(lastPaint<0||sec-lastPaint>=1/25||sec===STORY){paint(sec);lastPaint=sec}
       if(sec>1.3){$('sceneLabel').textContent=label(sec);$('sceneLabel').classList.add('show')}
       if(sec>=25)$('actions').classList.add('show');
     }
     mindar.renderer.render(mindar.scene,mindar.camera);
   });
 }catch(e){if(previewStream){previewStream.getTracks().forEach(x=>x.stop());previewStream=null}
   $('error').textContent=e?.message||String(e);$('ui').style.display='none';$('intro').classList.remove('hide');console.error(e)}
 finally{$('start').disabled=false}
}
$('start').onclick=startAR;
// Inspect the same three scenes in a browser before scanning the marker: ?demo=1.
// This does not change the AR route, and is not another visible start-screen button.
function demoLoop(){
 if(!demoOn)return;
 const elapsed=Math.min(STORY,(performance.now()-demoStart)/1000);
 draw(elapsed);$('demoCanvas').getContext('2d').drawImage(canvas,0,0);
 demoRAF=requestAnimationFrame(demoLoop)
}
function openDemo(){
 demoOn=true;$('demo').style.display='flex';demoStart=performance.now();demoRAF=requestAnimationFrame(demoLoop)
}
$('again').onclick=()=>{demoStart=performance.now()};
$('close').onclick=()=>{demoOn=false;cancelAnimationFrame(demoRAF);$('demo').style.display='none'};
if(new URLSearchParams(location.search).has('demo')){openDemo()}
</script></body></html>
